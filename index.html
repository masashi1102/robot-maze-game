<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロボット迷路チャレンジ！</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fc;color:#253a50;font-family:system-ui,'Meiryo',sans-serif}main{max-width:1160px;margin:auto;padding:17px}h1{margin:7px 0 15px;font-size:clamp(23px,3vw,32px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.label{display:inline-block;background:#d9e9fc;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:800}.stage-nav{display:flex;gap:6px;flex-wrap:wrap}.stage-nav button{border:2px solid #b7cfe8;background:white;color:#41678a;padding:8px 12px;border-radius:10px;font-weight:800}.stage-nav button.current{background:#2775bf;color:white;border-color:#2775bf}.stage-nav button.passed{border-color:#65bd80}.stage-nav button.locked{background:#e9eef4;color:#7b8996;border-color:#d4dfe8}.step button.del,.block-title button.del{background:#fff3f2;border:2px solid #e7aaa3;color:#a52929;font-weight:900;font-size:17px;min-width:32px;min-height:30px;line-height:1}.cmd .left{display:block;font-size:11px;color:#496c91;font-weight:600;margin-top:3px}.goal{line-height:1.5}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px}.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 6px 25px #30507016}.panel h2{margin:0 0 10px;font-size:19px}.goal{background:#e6f7eb;border-radius:10px;padding:10px 13px;margin-bottom:12px;font-weight:700}.maze{display:grid;gap:3px;width:min(100%,440px);margin:auto;padding:9px;background:#dce9f6;border-radius:14px}.cell{aspect-ratio:1;border-radius:6px;background:white;border:1px solid #c8d7e7;display:grid;place-items:center;position:relative;min-width:0}.wall{background:repeating-linear-gradient(45deg,#839bb2 0 8px,#9fb2c5 8px 16px);border-color:#839bb2}.start{background:#e3f2ff}.finish{background:#dcf8df}.cell small{position:absolute;top:2px;left:2px;font-size:8px;font-weight:bold;z-index:1}.flag{font-size:clamp(13px,2.5vw,23px)}.bot{width:87%;height:87%;z-index:3;transform-origin:center;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;filter:drop-shadow(0 2px 1px #4565)}.head{flex-shrink:0;background:#8bc9f1;border:2px solid #3a78a9;border-radius:11px;width:100%;height:47%;display:grid;place-items:center}.face{background:white;border-radius:8px;padding:0 2px;font-weight:bold;font-size:clamp(8px,1.8vw,17px)}.body{flex-shrink:0;background:#4b9bd4;border:2px solid #3a78a9;border-radius:6px;width:65%;height:38%}.arrow{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:clamp(10px,2vw,17px);color:#e17a2c}.robot-svg{display:block;width:100%;height:100%;overflow:visible}.bot.walk{animation:bob .22s infinite alternate}@keyframes bob{to{translate:0 -3px}}.status{margin-top:13px;background:#f0f5fb;padding:11px 13px;border-radius:10px;min-height:62px;line-height:1.5;font-size:14px}.status strong{display:block}.status.bad{background:#fff0e8;color:#a34b21}.status.good{background:#e2f7e7;color:#176b39}.commands{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cmd{background:#e7f2ff;border:2px solid #a7c9e9;border-radius:11px;color:#245a90;padding:11px 3px;font-weight:bold;min-height:52px;font-size:clamp(12px,1.4vw,15px)}.cmd.special{background:#eee6fc;border-color:#c9b5ee;color:#7140a6}.cmd.branch{background:#fff1df;border-color:#edc99a;color:#8a561f}.cmd:hover:not(:disabled){filter:brightness(.96)}button{cursor:pointer;font:inherit}button:disabled{opacity:.45;cursor:not-allowed}.seq{min-height:160px;max-height:320px;overflow-y:auto;border:2px dashed #c9d8e8;border-radius:11px;padding:10px;display:flex;gap:6px;flex-direction:column}.empty{color:#7c90a4;padding:22px 5px;text-align:center}.step{background:#f0f6fd;border:1px solid #bed2e5;border-radius:8px;padding:6px;display:flex;align-items:center;gap:6px;font-size:13px;min-height:35px}.step.active{outline:3px solid #f6c24c}.step .txt{flex:1}.step button{border:1px solid #cbd9e7;background:white;border-radius:5px;padding:3px 8px}.block{border:2px solid #c9b5ee;background:#f7f2ff;border-radius:10px;padding:7px}.block.branchbox{border-color:#edc99a;background:#fff8ed}.block-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:800;font-size:13px}.block-title .grow{flex:1}.block-title button{border:1px solid #d6c9e8;border-radius:6px;background:white;padding:3px 9px}.inner{margin:6px 0 2px 13px;border-left:3px solid #d2bbee;padding-left:8px;display:flex;flex-direction:column;gap:5px}.inner.ifinner{border-left-color:#edc99a}.insert{border:1px dashed #9ab5d0;border-radius:6px;background:#fff;padding:7px;text-align:left;color:#476a89;font-size:12px;font-weight:700}.insert.selected{background:#d9edff;border-color:#2677c5;color:#1c5d99}.insert.ifselected{background:#ffebcf;border-color:#d69d49}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:#2473c4;color:white;border:0;border-radius:10px;padding:12px 16px;flex:1;font-weight:bold}.secondary{background:#f3f7fb;border:1px solid #c9d8e8;color:#355a7a;border-radius:10px;padding:10px;font-weight:bold}.target{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0 7px;font-size:13px;font-weight:bold}.target button{border:1px solid #b9d4ea;background:#e8f3ff;border-radius:7px;padding:6px 10px;color:#245a90;font-size:12px;font-weight:800}.victory{position:fixed;inset:0;z-index:100;background:#09254cdb;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:14px}.victory[hidden]{display:none}.victory-card{z-index:2;background:#fffdf4;border:5px solid #ffd05c;border-radius:30px;padding:30px 48px;max-width:95vw;box-shadow:0 0 90px #ffcc60a0;animation:pop .55s ease-out}.party{font-size:clamp(30px,5vw,65px)}.victory-title{font-size:clamp(55px,10vw,120px);font-weight:1000;color:#ef8820;text-shadow:3px 5px #ffdf83;white-space:nowrap}.victory-buttons{display:flex;gap:10px;justify-content:center;margin-top:15px;flex-wrap:wrap}.victory-buttons button{min-width:120px}.confetti-layer{position:absolute;inset:0;pointer-events:none}.piece{position:absolute;top:-20%;width:11px;height:19px;border-radius:2px;animation:fall 3s linear infinite}@keyframes fall{to{transform:translateY(135vh) rotate(900deg)}}@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:820px){.layout{grid-template-columns:1fr}main{padding:10px}.panel{padding:12px}.maze{max-width:385px}.cmd{font-size:13px}.stage-nav button{padding:6px 9px}}@media(prefers-reduced-motion:reduce){.piece,.victory-card,.bot.walk{animation:none}}

/* Keep every tile the same size even when the robot moves or rotates. */
.maze{grid-auto-rows:auto;align-items:stretch;}
.cell{width:100%;min-width:0;min-height:0;overflow:hidden;contain:layout paint;}
.bot{position:absolute;inset:0;margin:auto;width:68%;height:68%;max-width:68%;max-height:68%;transform-origin:center;pointer-events:none;}
.robot-svg{width:100%;height:100%;overflow:hidden;}
.cell small{font-size:clamp(5px,.7vw,8px);line-height:1;}

/* Live execution indicator and visible active command. */
.live{display:none;background:#fff3d5;border:2px solid #efb548;border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:900;text-align:center;color:#794a06;font-size:clamp(18px,2vw,25px);box-shadow:0 2px 9px #e5a72b2b}
.live.on{display:block}
.seq .active{outline:3px solid #f1a92c!important;background:#fff1bf!important;box-shadow:0 0 0 3px #ffdf91}
.seq .active>.txt{font-size:1.18em;font-weight:900}
.block-title.active{border-radius:7px;padding:5px;background:#ffedc1}
.repeat-count{font-size:14px;font-weight:800;border:2px solid #bca2e5;border-radius:6px;padding:4px;background:white;color:#60339b}
/* Stage 5 learning requirements shown directly on the two cards. */
.cmd .require-note{display:block;margin-top:5px;font-size:11px;font-weight:800;line-height:1.25;color:#6a428e}
.cmd.branch .require-note{color:#8a561f}
/* A distinct no-operation card for branches. */
.cmd.noop{background:#e9f3e9;border-color:#aacbab;color:#426746}
/* Keep command list usable during execution. */
.seq{scroll-behavior:auto}

.repeat-count-wrap{display:flex;align-items:center;gap:9px;background:#e4d5ff;border:2px solid #a77bdc;border-radius:9px;padding:7px 10px;margin:7px 0 3px;font-weight:900;color:#59318c;flex-wrap:wrap}
.repeat-count-wrap label{font-size:15px;white-space:nowrap}
.repeat-count{font-size:19px;min-width:86px;min-height:40px;border:2px solid #8754bf;background:#fff;color:#50268a;font-weight:900;cursor:pointer}
.insert-root{border:2px dashed #76a7d5;background:#e7f4ff;color:#225d95;border-radius:9px;padding:12px 10px;font-weight:900;font-size:14px;cursor:pointer;width:100%;margin-top:8px}
.insert-root.selected{border-color:#2a77bd;background:#cfe8ff}
.target:has(#rootTarget[hidden]){display:none}
/* Primary action first; continuing is deliberately secondary. */
.run-from-start{background:#eee8fa;border:2px solid #c6b5e9;color:#5d4a83;border-radius:10px;padding:12px 15px;font-weight:800;flex:1}
.controls #run{background:#2473c4;color:#fff;flex:1.25}
/* Keep the failing (or last executed) command visible after execution stops. */
.seq .step.failed,.seq .block-title.failed{background:#ffe3dd!important;outline:3px solid #e55340!important;box-shadow:0 0 0 3px #ffd1c9}
.seq .step.failed .txt,.seq .block-title.failed .grow{color:#a62f22;font-size:1.15em;font-weight:900}
.seq .step.last-run,.seq .block-title.last-run{background:#fff0c9!important;outline:3px solid #e2a43a!important}
.failure-notice{display:none;border:3px solid #e45b45;background:#fff0ea;color:#982f20;border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:800;box-shadow:0 3px 10px #d87b6430}
.failure-notice.on{display:block}
.failure-notice strong{display:block;font-size:clamp(18px,2.2vw,25px);line-height:1.4}
.failure-notice small{display:block;font-size:13px;margin-top:5px;color:#814c3c}
.failure-notice.partial{border-color:#d69e35;background:#fff5d9;color:#795009}
.failure-notice.partial small{color:#795009}
</style></head><body><main><div class="top"><div><span id="stageLabel" class="label">STAGE 1 / 5</span><h1>🤖 ロボット迷路チャレンジ！</h1></div><nav id="stageNav" class="stage-nav" aria-label="ステージを選ぶ"></nav></div><div class="layout"><section class="panel"><h2 id="stageTitle">🗺️ 迷路</h2><div id="goal" class="goal">🎯 ゴールを目指そう！</div><div id="maze" class="maze"></div><div id="status" class="status" role="status" aria-live="polite"><strong>準備OK！</strong>命令をクリックしてください。</div></section><section class="panel"><h2>🧩 命令</h2><div id="commands" class="commands"><button class="cmd" data-cmd="F">⬆ 前に進む</button><button class="cmd" data-cmd="L">↶ 左に向く</button><button class="cmd" data-cmd="R">↷ 右に向く</button><button class="cmd special" data-cmd="repeat">🔁 繰り返す</button><button class="cmd branch" data-cmd="if">◆ もし壁が前なら</button><button class="cmd noop" data-cmd="N">○ 何もしない</button></div><div class="target"><span id="targetName">追加先：全体</span><button id="rootTarget" hidden>↩ 全体に戻る</button></div><div id="live" class="live" aria-live="polite"></div><div id="failureNotice" class="failure-notice" role="alert" aria-live="assertive"></div><div id="seq" class="seq"></div><div class="controls"><button id="run" class="primary">▶ 実行！</button><button id="runFromStart" class="secondary run-from-start" hidden>↺ 最初から実行</button><button id="stop" class="secondary" disabled>■ 停止</button></div><div class="controls"><button id="undo" class="secondary">↩ 1つ戻す</button><button id="clear" class="secondary">⟲ 全部消す</button><button id="reset" class="secondary">🏠 スタートに戻す</button></div></section></div></main><div id="victory" class="victory" hidden role="dialog" aria-modal="true" aria-label="ステージクリア"><div id="confetti" class="confetti-layer"></div><div class="victory-card"><div class="party">🎉 🎊 🎉</div><div class="victory-title">クリア！</div><div id="clearStage" style="font-weight:800;margin:6px 0"></div><div class="victory-buttons"><button id="next" class="primary">次のステージ ▶</button><button id="again" class="secondary">もう一度</button><button id="dismiss" class="secondary">とじる</button></div></div></div><script>(()=>{'use strict';
const $=id=>document.getElementById(id),dirs=[[0,-1],[1,0],[0,1],[-1,0]],names={F:'前に進む',L:'左に向く',R:'右に向く',N:'何もしない'};
function stageFromPath(n,start,goal,parts){let cells=new Set([start.join(','),goal.join(',')]);for(const [x1,y1,x2,y2] of parts){let dx=Math.sign(x2-x1),dy=Math.sign(y2-y1);let x=x1,y=y1;while(true){cells.add(x+','+y);if(x===x2&&y===y2)break;x+=dx;y+=dy}}let map=[];for(let y=0;y<n;y++){let row='';for(let x=0;x<n;x++)row+=cells.has(x+','+y)?'.':'#';map.push(row)}return map}
function croppedPath(n,start,goal,parts,pad=0){
 const old=stageFromPath(n,start,goal,parts);let xs=[],ys=[];
 for(let y=0;y<old.length;y++)for(let x=0;x<old[y].length;x++)if(old[y][x]!== '#'){xs.push(x);ys.push(y)}
 const minX=Math.max(0,Math.min(...xs)-pad),maxX=Math.min(n-1,Math.max(...xs)+pad);
 const minY=Math.max(0,Math.min(...ys)-pad),maxY=Math.min(n-1,Math.max(...ys)+pad);
 return {map:old.slice(minY,maxY+1).map(row=>row.slice(minX,maxX+1)),start:{x:start[0]-minX,y:start[1]-minY,d:1},finish:{x:goal[0]-minX,y:goal[1]-minY}};
}
const stages=[
 {title:'曲がり道に挑戦！',goal:'🎯 命令を組み立ててゴールを目指そう！',...croppedPath(7,[1,5],[5,1],[[1,5,5,5],[5,5,5,3],[5,3,3,3],[3,3,3,1],[3,1,5,1]]),repeat:'none',branch:false,cap:30,limits:{F:12,L:2,R:2},speed:310},
 {title:'繰り返しの基本',goal:'🎯 カードを全部使って繰り返そう！',...croppedPath(6,[1,1],[1,4],[[1,1,4,1],[4,1,4,4],[4,4,1,4]]),repeat:'count',branch:false,cap:10,limits:{F:3,L:0,R:1,repeat:1},speed:230},
 {title:'2つの繰り返し',goal:'🎯 カードを全部使い、2つの繰り返しでゴールへ！',...croppedPath(9,[2,2],[2,6],[[2,2,4,2],[4,2,4,4],[4,4,2,4],[2,4,2,6]]),repeat:'count',branch:false,cap:15,limits:{F:4,L:1,R:1,repeat:2},speed:195},
 {title:'2つの分岐に挑戦！',goal:'🎯 2つの分岐でゴールを目指そう！',map:['##.##','##..G','##.##','S..##'],start:{x:0,y:3,d:1},finish:{x:4,y:1},repeat:'none',branch:true,cap:16,limits:{F:6,L:1,R:1,N:2,if:2},speed:205},
 {title:'最終試練！',goal:'🎯 自由な方法でゴールを目指そう！',map:['#########', '#......G#', '#.#######', '#.#.....#', '#.#.###.#', '#...#...#', '#####.#.#', '#S....#.#', '#########'],start:{x:1,y:7,d:1},finish:{x:7,y:1},repeat:'count',branch:true,cap:450,limits:null,speed:105}
];
for(const st of stages){if(!st.finish){for(let y=0;y<st.map.length;y++)for(let x=0;x<st.map[y].length;x++)if(st.map[y][x]==='G')st.finish={x,y}}}
let stage=0,seq=[],pos={},busy=false,activeId=null,token=0,anim='',target={id:null,branch:null},uid=0,executed=0,liveText='',failedId=null,failTitle='',failDetail='',failPartial=false;const passed=new Set();let unlocked=0;const wait=ms=>new Promise(r=>setTimeout(r,ms));
function message(title,body='',kind=''){let el=$('status');el.className='status '+kind;el.replaceChildren();let strong=document.createElement('strong');strong.textContent=title;el.append(strong,document.createTextNode(body))}
function clearFailure(){failedId=null;failTitle='';failDetail='';failPartial=false}
function markFailure(title,detail,partial=false){failedId=activeId;failTitle=title;failDetail=detail;failPartial=partial}
function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function findBlock(id,list=seq){for(const n of list){if(n.id===id)return n;if(n.type==='repeat'){const r=findBlock(id,n.body);if(r)return r}if(n.type==='if'){const a=findBlock(id,n.yes);if(a)return a;const b=findBlock(id,n.no);if(b)return b}}return null}
function destination(){if(target.id===null)return seq;const n=findBlock(target.id);if(!n){target={id:null,branch:null};return seq}return n[target.branch]||seq}
function targetTitle(){if(target.id===null)return'全体';const n=findBlock(target.id);return !n?'全体':n.type==='repeat'?'繰り返しの中':target.branch==='yes'?'「はい」の中':'「いいえ」の中'}
function countType(type,list=seq){let count=0;for(const n of list){if(n.type===type||(n.type==='cmd'&&n.cmd===type))count++;if(n.type==='repeat')count+=countType(type,n.body);if(n.type==='if')count+=countType(type,n.yes)+countType(type,n.no)}return count}
function countNodes(list=seq){let k=0;for(const n of list){k++;if(n.type==='repeat')k+=countNodes(n.body);if(n.type==='if')k+=countNodes(n.yes)+countNodes(n.no)}return k}
function mazeDraw(){let st=stages[stage],m=$('maze');m.replaceChildren();let rows=st.map.length,cols=st.map[0].length;m.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let wall=st.map[y][x]==='#',start=st.start.x===x&&st.start.y===y,finish=st.finish.x===x&&st.finish.y===y,e=make('div','cell '+(wall?'wall':start?'start':finish?'finish':''));if(start||finish){let label=make('small','',start?'START':'GOAL');e.append(label)}if(finish&&!(pos.x===x&&pos.y===y))e.append(make('span','flag','🏁'));if(pos.x===x&&pos.y===y){let bot=make('div','bot '+anim);bot.innerHTML=stage===4?'<svg class="robot-svg" viewBox="0 0 64 82" xmlns="http://www.w3.org/2000/svg" aria-label="進行方向"><path d="M32 80 L5 28 L20 28 L20 6 L44 6 L44 28 L59 28 Z" fill="#f28a32" stroke="#a94713" stroke-width="4" stroke-linejoin="round"/></svg>':'<svg class="robot-svg" viewBox="0 0 64 82" xmlns="http://www.w3.org/2000/svg" aria-label="ロボット"><path d="M18 45 L7 57 M46 45 L57 57 M25 66 L20 71 M39 66 L44 71" stroke="#346f9e" stroke-width="5" stroke-linecap="round"/><rect x="11" y="5" width="42" height="37" rx="12" fill="#88c8f2" stroke="#397bac" stroke-width="3"/><rect x="17" y="14" width="30" height="20" rx="7" fill="#fff"/><circle cx="26" cy="23" r="2.6" fill="#274c6a"/><circle cx="38" cy="23" r="2.6" fill="#274c6a"/><path d="M26 29 Q32 34 38 29" stroke="#274c6a" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="19" y="44" width="26" height="24" rx="8" fill="#4b9bd4" stroke="#397bac" stroke-width="3"/><path d="M32 79 L22 70 L42 70 Z" fill="#f28a32" stroke="#c45c1c" stroke-width="2"/></svg>';bot.style.transform=`rotate(${(pos.d+2)*90}deg)`;e.append(bot)}m.append(e)}}
function selectTarget(id,branch){if(busy)return;target={id,branch};render()}
function innerInsert(id,branch){const b=make('button','insert'+(target.id===id&&target.branch===branch?' selected':''),'+ ここに命令を追加');b.disabled=busy;b.onclick=()=>selectTarget(id,branch);return b}
function renderList(list,parent){
 for(const n of list){
  if(n.type==='cmd'){
   let e=make('div','step'+(activeId===n.id?' active':'')+(failedId===n.id?(failPartial?' last-run':' failed'):'')),name=make('span','txt',names[n.cmd]),del=make('button','del','×');
   del.title='この命令を消す';del.disabled=busy;del.onclick=()=>removeNode(n.id);e.append(name,del);parent.append(e);
  }else{
   let isIf=n.type==='if',e=make('div','block'+(isIf?' branchbox':'')),top=make('div','block-title'+(activeId===n.id?' active':'')+(failedId===n.id?(failPartial?' last-run':' failed'):'')),label=make('span','grow',isIf?'◆ もし壁が前なら':'🔁 繰り返す');top.append(label);
   let del=make('button','del','×');del.title='ブロックを消す';del.disabled=busy;del.onclick=()=>removeNode(n.id);top.append(del);e.append(top);
   if(isIf){
    for(const [key,caption] of [['yes','はい（壁がある）'],['no','いいえ（壁がない）']]){
     let cap=make('div','',caption);cap.style.cssText='font-size:12px;font-weight:800;margin:7px 0 3px';e.append(cap);
     let inner=make('div','inner ifinner');renderList(n[key],inner);
     if(n[key].length===0)inner.append(innerInsert(n.id,key));
     e.append(inner);
    }
   }else{
    let wrap=make('div','repeat-count-wrap'),labelCount=make('label','','回数を選ぶ →');
    let count=make('select','repeat-count');count.title='繰り返す回数を選ぶ';count.setAttribute('aria-label','繰り返す回数');
    for(let k=1;k<=10;k++){let o=make('option','',k+'回');o.value=String(k);o.selected=n.times===k;count.append(o)}
    count.disabled=busy;count.onchange=()=>{clearFailure();n.times=Number(count.value);render()};wrap.append(labelCount,count);e.append(wrap);
